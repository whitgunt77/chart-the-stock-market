<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart The Stock Market</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for rendering stock trend lines -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Socket.io client -->
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body
    class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center p-4 sm:p-8"
  >
    <div
      class="max-w-4xl w-full bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700"
    >
      <header class="mb-6 text-center">
        <h1 class="text-3xl font-extrabold tracking-wide text-cyan-400">
          Chart The Stock Market
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Real-time collaborative stock trend viewer powered by WebSockets
        </p>
      </header>

      <!-- Stock Graph Container -->
      <div
        class="relative bg-slate-900 p-4 rounded-xl border border-slate-700 mb-6 h-80 sm:h-96"
      >
        <canvas id="stockChart"></canvas>
      </div>

      <!-- Controls / Add Stock Form -->
      <form id="addStockForm" class="flex flex-col sm:flex-row gap-3 mb-6">
        <input
          type="text"
          id="stockInput"
          placeholder="Enter Stock Symbol (e.g., TSLA, AAPL)"
          autocomplete="off"
          required
          class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-slate-100 focus:outline-none focus:border-cyan-400 uppercase font-semibold"
        />
        <button
          type="submit"
          class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2.5 rounded-lg transition shadow-lg"
        >
          Add Stock
        </button>
      </form>

      <!-- Active Stock Badges Container -->
      <div>
        <h2
          class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3"
        >
          Active Tracked Stocks:
        </h2>
        <div id="stockBadges" class="flex flex-wrap gap-2.5">
          <!-- Dynamically inject badges -->
        </div>
      </div>
    </div>

    <script>
      const socket = io();
      let stockChart = null;
      let stockDatabase = []; // Stores full dataset objects { symbol, dates, prices }

      // Distinct color pool for stock lines
      const colorPalette = [
        "#22d3ee",
        "#f43f5e",
        "#fbbf24",
        "#a855f7",
        "#34d399",
        "#3b82f6",
        "#fb923c",
        "#ec4899",
      ];

      // Initialize Chart.js
      function initChart(datasetsData = []) {
        const ctx = document.getElementById("stockChart").getContext("2d");

        // Extract unique timeline dates across datasets
        const allDates = datasetsData.length > 0 ? datasetsData[0].dates : [];

        const formattedDatasets = datasetsData.map((stock, index) => ({
          label: stock.symbol,
          data: stock.prices,
          borderColor: colorPalette[index % colorPalette.length],
          backgroundColor: colorPalette[index % colorPalette.length],
          borderWidth: 2.5,
          pointRadius: 2,
          tension: 0.1,
        }));

        if (stockChart) {
          stockChart.destroy();
        }

        stockChart = new Chart(ctx, {
          type: "line",
          data: {
            labels: allDates,
            datasets: formattedDatasets,
          },
          options: {
            responsive: true,
            maintainsAspectRatio: false,
            scales: {
              x: {
                grid: { color: "rgba(255, 255, 255, 0.05)" },
                ticks: { color: "#94a3b8" },
              },
              y: {
                grid: { color: "rgba(255, 255, 255, 0.05)" },
                ticks: { color: "#94a3b8" },
              },
            },
            plugins: {
              legend: {
                labels: { color: "#f8fafc", font: { family: "Helvetica" } },
              },
            },
          },
        });
      }

      // Render interactive removable stock badges
      function renderBadges() {
        const container = document.getElementById("stockBadges");
        container.innerHTML = "";

        stockDatabase.forEach((stock, index) => {
          const color = colorPalette[index % colorPalette.length];
          const badge = document.createElement("div");
          badge.className =
            "flex items-center gap-2 bg-slate-900 border px-3 py-1.5 rounded-lg shadow";
          badge.style.borderColor = color;

          badge.innerHTML = `
                  <span class="w-3 h-3 rounded-full" style="background-color: ${color};"></span>
                  <span class="font-bold tracking-wide">${stock.symbol}</span>
                  <button onclick="removeStock('${stock.symbol}')" class="text-slate-400 hover:text-red-400 ml-2 font-bold text-lg leading-none">&times;</button>
                `;
          container.appendChild(badge);
        });
      }

      // Socket Event: Initial load when connecting
      socket.on("init_stocks", (stocks) => {
        stockDatabase = stocks;
        initChart(stockDatabase);
        renderBadges();
      });

      // Socket Event: Real-time update when another user adds a stock
      socket.on("stock_added", (stockData) => {
        if (!stockDatabase.some((s) => s.symbol === stockData.symbol)) {
          stockDatabase.push(stockData);
          initChart(stockDatabase);
          renderBadges();
        }
      });

      // Socket Event: Real-time update when another user removes a stock
      socket.on("stock_removed", (symbol) => {
        stockDatabase = stockDatabase.filter((s) => s.symbol !== symbol);
        initChart(stockDatabase);
        renderBadges();
      });

      // Handle form submission to add a stock
      document
        .getElementById("addStockForm")
        .addEventListener("submit", (e) => {
          e.preventDefault();
          const input = document.getElementById("stockInput");
          const symbol = input.value.trim();
          if (symbol) {
            socket.emit("add_stock", symbol);
            input.value = "";
          }
        });

      // Global function triggered by badge remove buttons
      window.removeStock = function (symbol) {
        socket.emit("remove_stock", symbol);
      };
    </script>
  </body>
</html>
